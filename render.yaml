services:
  # SAGE FastAPI Backend Web Service
  - type: web
    name: sage-backend
    env: python
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sage-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "SAGE <insights@sage.dev>"
      - key: SYNC_INTERVAL_MINUTES
        value: "30"

databases:
  # SAGE PostgreSQL Database
  - name: sage-db
    databaseName: sage_db
    user: sage_user
